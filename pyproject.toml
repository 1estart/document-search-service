[project]
name = "document-search-service"
version = "0.1.0"
description = "Simple document search service"
readme = "README.md"
authors = [{ name = "Artemiy", email = "artem.pospelov2018@yandex.ru" }]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "elasticsearch[async]>=8.15,<9",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "testcontainers[elasticsearch,postgres]>=4.0",
    "httpx2>=0.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: требуют Elasticsearch и PostgreSQL"]
testpaths = ["tests"]
